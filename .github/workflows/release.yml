name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.4'
          bundler-cache: false
      - run: bundle config set --local frozen true
      - run: bundle install
      - run: bundle exec rake

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.4'
          bundler-cache: false
      - name: Check the tag matches the gem version
        run: |
          ruby -e 'spec = Gem::Specification.load("card_dealer.gemspec"); tag = ENV.fetch("GITHUB_REF_NAME"); abort "tag #{tag} does not match version #{spec.version}" unless tag == "v#{spec.version}"'
      - run: mkdir -p pkg && gem build card_dealer.gemspec --output pkg/card_dealer.gem
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-gem
          path: pkg/card_dealer.gem
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, build]
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built-gem
          path: pkg/
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.4'
          bundler-cache: false
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - run: gem exec --conservative sigstore-cli:0.2.3 sign pkg/card_dealer.gem --bundle pkg/card_dealer.gem.sigstore.json
      - run: gem push pkg/card_dealer.gem --attestation pkg/card_dealer.gem.sigstore.json
